name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  # Advisory until the pre-existing baseline is fixed:
  # `npm run check` fails on main (.insertId MySQL leftovers) and
  # `npm run lint` has ~180 pre-existing errors. Once those are cleaned
  # up, remove continue-on-error to make these required gates.
  typecheck:
    name: Typecheck (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
